name: CI

on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: 1.96.1

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust and lint components
        run: rustup toolchain install 1.96.1 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --release --locked

  action-contract:
    name: Action contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust and lint components
        run: rustup toolchain install 1.96.1 --profile minimal --component rustfmt --component clippy
      - name: Verify entrypoint contract
        run: ./action/tests/entrypoint_test.sh
      - name: Audit a clean feed through the Docker action
        uses: ./
        with:
          feed: samples/clean.xml
      - name: Reject a broken feed in strict mode
        id: broken_feed
        continue-on-error: true
        uses: ./
        with:
          feed: samples/broken.xml
      - name: Verify strict failure reached the workflow
        env:
          OUTCOME: ${{ steps.broken_feed.outcome }}
        run: test "$OUTCOME" = failure

  audit:
    name: RustSec audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust and lint components
        run: rustup toolchain install 1.96.1 --profile minimal --component rustfmt --component clippy
      - name: Install locked advisory checker
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit locked dependency graph
        run: cargo audit
