[workspace]
resolver = "2"
members = ["engine", "cli"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"
authors = ["Greenlit Goods"]
rust-version = "1.96"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
